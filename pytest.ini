[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --tb=short
    --strict-markers
    --cov=app
    --cov=config
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-fail-under=95
mocked-sessions = app.db.session
mocked-engines = app.db.engine
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    no_db: marks tests that don't need database access

# pytest-xdist configuration for parallel execution
# Run with: pytest -n auto --dist=loadscope
# Note: Coverage doesn't work well with xdist; use --no-cov for parallel runs
