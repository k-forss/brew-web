# A generic, single database configuration.

[alembic]
script_location = %(here)s
prepend_sys_path = ..
# template used to generate migration files
# file_template = %%(rev)s_%%(slug)s

# set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
# revision_environment = false

# NOTE: This Alembic configuration is designed for use with Flask-Migrate only.
# Do NOT use standalone `alembic` CLI commands. Always use `flask db <command>`
# which provides the application context and database URI automatically.
# sqlalchemy.url is intentionally omitted - Flask-Migrate manages this internally.


# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic,flask_migrate

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[logger_flask_migrate]
level = INFO
handlers =
qualname = flask_migrate

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
