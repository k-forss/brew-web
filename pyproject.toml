[project]
name = "brew-web"
version = "0.1.0"
description = "Brew Web Application"
requires-python = ">=3.10"

[tool.ruff]
# Target Python version
target-version = "py310"

# Line length
line-length = 100

# Exclude patterns
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "*.egg-info",
    ".eggs",
    "build",
    "dist",
]

[tool.ruff.lint]
# Enable all rules by default, then selectively disable
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort (import sorting)
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "PTH",    # flake8-use-pathlib
    "ERA",    # eradicate (commented-out code)
    "RUF",    # Ruff-specific rules
]

# Allow autofix for all enabled rules
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
# Ignore certain rules in test files
"tests/**/*.py" = [
    "ARG",    # Unused arguments in fixtures
    "S101",   # Use of assert (acceptable in tests)
]
# Ignore certain rules in config files
"config/**/*.py" = [
    "TCH",    # Type checking imports
]

[tool.ruff.lint.isort]
known-first-party = ["app", "config", "tests"]
force-single-line = false
lines-after-imports = 2
lines-between-types = 1
force-sort-within-sections = false

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
# Python version
python_version = "3.10"

# Gradual typing adoption - strict=false for legacy code compatibility
# Allows incremental type annotation without breaking existing code
# Strictness settings (gradual adoption)
strict = false
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
disallow_untyped_defs = false  # Relaxed for gradual adoption
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false

# Exclude patterns (don't try to type-check non-existent directories)
exclude = [
    "^config/",  # Exclude non-existent config directory
]

[[tool.mypy.overrides]]
module = [
    "flask.*",
    "flask_sqlalchemy.*",
    "flask_migrate.*",
    "flask_login.*",
    "flask_limiter.*",
    "sqlalchemy.*",
    "pytest",
]
ignore_missing_imports = true

[tool.black]
# Black formatter configuration
line-length = 88
target-version = ["py310"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.venv
    | venv
    | __pycache__
    | \.egg-info
    | \.eggs
    | build
    | dist
)/
'''

[tool.bandit]
# Bandit security linter configuration
exclude_dirs = ["tests", ".venv", "venv"]
